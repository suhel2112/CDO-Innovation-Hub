name: pr-ci

on:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r Data-Engineering/dbt-analytics-lakehouse-demo/requirements.txt

      - name: dbt build (dev)
        run: |
          cd Data-Engineering/dbt-analytics-lakehouse-demo/analytics
          dbt deps --profiles-dir .
          dbt seed --full-refresh --profiles-dir .
          dbt build --fail-fast --profiles-dir .

      - name: dbt docs generate
        run: |
          cd Data-Engineering/dbt-analytics-lakehouse-demo/analytics
          dbt docs generate --profiles-dir .

      - name: Upload dbt artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts
          path: |
            Data-Engineering/dbt-analytics-lakehouse-demo/analytics/target/manifest.json
            Data-Engineering/dbt-analytics-lakehouse-demo/analytics/target/run_results.json
            Data-Engineering/dbt-analytics-lakehouse-demo/analytics/target/catalog.json
